# Loaded inside nginx http{}. Each tenant has a mock API and a static UI.
# Unhandled API paths return 404; UI paths fall back to index.html.

# Allow CORS from whatever origin the SPA is served from
map $http_origin $cors_allow_origin {
    default $http_origin;
    ""      "*";
}

# Mocked token echoed across stubbed responses
map $http_x_okapi_token $token { default devtoken; }

# Access and refresh token expiry for the login and refresh stubs, computed
# per request (token-expiry.js says why). njs is loaded by load-njs.sh.
js_import token_expiry from /etc/nginx/token-expiry.js;
js_set $token_expiry token_expiry.expiry;

server {
    listen 9130;
    default_type application/json;
    set $tenant test1;
    include /etc/nginx/okapi-stubs.inc;
}

server {
    listen 3000;
    root /usr/share/nginx/bundle/test1;

    location / {
        try_files $uri /index.html;
    }

    access_log off;
}

server {
    listen 9131;
    default_type application/json;
    set $tenant test2;
    include /etc/nginx/okapi-stubs.inc;
}

server {
    listen 3002;
    root /usr/share/nginx/bundle/test2;

    location / {
        try_files $uri /index.html;
    }

    access_log off;
}
