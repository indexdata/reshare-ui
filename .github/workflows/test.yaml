name: test

on:
  pull_request:
  # allows deploy workflows to run these tests as a gating job
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: prepare
        run: yarn config set @folio:registry https://repository.folio.org/repository/npm-folio/

      - name: Do yarn install
        run: yarn install --frozen-lockfile

      # Jest prints a `● Console` block per test file that logged something, but they
      # scroll away. Annotate the PR instead, without failing the gate.
      - name: Test stripes-reshare
        shell: bash # for -o pipefail, so tee cannot mask a jest failure
        run: |
          yarn workspace @projectreshare/stripes-reshare test --ci 2>&1 | tee jest.log
          n=$(grep -c '● Console' jest.log || true)
          [ "$n" -gt 0 ] && echo "::warning::stripes-reshare: console output in $n test file(s)" || true

      - name: Test ui-rs
        shell: bash
        run: |
          yarn workspace @projectreshare/rs test --ci 2>&1 | tee jest.log
          n=$(grep -c '● Console' jest.log || true)
          [ "$n" -gt 0 ] && echo "::warning::ui-rs: console output in $n test file(s)" || true

      # PR-only: pushes to main already build the full deploy
      # platform in deploy-resharex.yaml, this lets PRs verify
      # at least the leaner dev platform builds
      - name: Build platform-rs-dev
        if: github.event_name == 'pull_request'
        run: yarn workspace @projectreshare/platform-rs-dev build
