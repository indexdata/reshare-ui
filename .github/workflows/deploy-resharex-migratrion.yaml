name: deploy-resharex-migration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      source_sha:
        required: false
        type: string
      source_repo:
        required: false
        type: string

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'us-east-1'
  TENANTS: >-
    arrowhead
    carverlib
    plumcreeklibrary
    scottlib
    pioneerland
    ecrlib
    anokacounty
    minitex
    sppl
    rclreads
    mnlinktest
    washcolib
    selco
    rplmn
    hclib
    dpl
    nwrlib
    dakota
    krls
    griver
    larl
    umn
    tdslib
    vikinglibrarysystem

jobs:
  test:
    # don't run CI if commit includes  [ci skip] or [skip ci]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    uses: ./.github/workflows/test.yaml

  deploy:
    needs: test

    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy triggered from ${{ inputs.source_repo }} @ ${{ inputs.source_sha }}"

      - name: checkout module
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: environments/platform-resharexmigration/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: prepare
        run: yarn config set @folio:registry https://repository.folio.org/repository/npm-folio/
        working-directory: ./environments/platform-resharexmigration

      - name: Do yarn install
        run: yarn install
        working-directory: ./environments/platform-resharexmigration

      - name: Upload yarn.lock
        uses: actions/upload-artifact@v4
        with:
          name: yarn.lock
          path: environments/platform-resharexmigration/yarn.lock

      - name: build webpacks
        run: |
          set -euo pipefail
          for tenant in $TENANTS; do
            rm -rf "./${tenant}"
            yarn build --tenant "$tenant" --okapi "https://${tenant}-migration-okapi.reshare-dev.indexdata.com"
            mv output "./${tenant}"
          done
        working-directory: ./environments/platform-resharexmigration

      - name: upload builds
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          # Hashed chunk filenames change on every build, so they're safe to cache
          # forever; index.html is not hashed and must always be revalidated so
          # clients pick up the chunk names from the build that's actually live,
          # otherwise a stale index.html can reference chunks --delete just removed.
          for tenant in $TENANTS; do
            aws s3 sync "./${tenant}" "s3://reshare-bundles/${tenant}-migration" --acl public-read --delete \
              --cache-control "public,max-age=31536000,immutable" \
              --exclude "index.html"
            aws s3 cp "./${tenant}/index.html" "s3://reshare-bundles/${tenant}-migration/index.html" --acl public-read \
              --cache-control "no-cache, no-store, must-revalidate"
          done
        working-directory: ./environments/platform-resharexmigration
